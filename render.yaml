# Free tier has no persistent disk. SQLite lives on the container's ephemeral
# filesystem and is LOST on every redeploy and on wake from ~15-minute idle sleep.
# Each deploy starts a fresh World.new(SEED); the world does not simulate asleep.
# Upgrade: Starter + a persistent disk at /data, with TERRA_DB=/data/terra.db,
# for a durable world. Always use one process, one worker, and one instance.
services:
  - type: web
    name: terra
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.app:app --host 0.0.0.0 --port $PORT --workers 1 --no-access-log --log-config log_config.yaml
    healthCheckPath: /healthz
    # Never increase this: a second instance creates a divergent world.
    numInstances: 1
    envVars:
      - key: TERRA_DB
        value: /tmp/terra.db
      - key: PYTHON_VERSION
        value: 3.12.14
