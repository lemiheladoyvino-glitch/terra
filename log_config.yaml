version: 1
disable_existing_loggers: false
formatters:
  standard:
    format: '%(asctime)s %(levelname)s %(name)s: %(message)s'
handlers:
  stdout:
    class: logging.StreamHandler
    stream: ext://sys.stdout
    formatter: standard
root:
  level: INFO
  handlers: [stdout]
loggers:
  server:
    level: INFO
    handlers: [stdout]
    propagate: false
  uvicorn:
    level: INFO
    handlers: [stdout]
    propagate: false
  uvicorn.error:
    level: INFO
  uvicorn.access:
    level: INFO
    handlers: [stdout]
    propagate: false
  httpx:
    level: WARNING
  httpcore:
    level: WARNING
  websockets:
    level: WARNING
  asyncio:
    level: WARNING
